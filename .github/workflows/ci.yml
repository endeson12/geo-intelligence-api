name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env: {POSTGRES_DB: geo, POSTGRES_USER: geo, POSTGRES_PASSWORD: geo}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geo -d geo" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://geo:geo@localhost:5432/geo
      API_KEY: test-secret
      RUN_POSTGIS_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {python-version: "3.12", enable-cache: true}
      - run: uv sync --all-groups --frozen
      - name: Auditar dependências Python
        run: uv run pip-audit
      - name: Gerar SBOM CycloneDX
        run: uv run cyclonedx-py environment --output-reproducible --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@v5
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/data_quality.py data/osm-teresina-health.geojson --output /tmp/data-quality-report.json
      - run: uv run alembic upgrade head
      - name: Importar limite oficial do IBGE
        run: uv run python scripts/import_territories.py data/ibge-teresina-boundary.geojson
      - name: Benchmark GiST reproduzível
        run: uv run python scripts/benchmark_postgis.py --output benchmark-postgis.json
      - uses: actions/upload-artifact@v5
        with:
          name: benchmark-postgis
          path: benchmark-postgis.json
      - run: uv run pytest --cov=geo_intelligence_api --cov-report=term-missing
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker build --tag geo-intelligence-api:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: geo-intelligence-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
