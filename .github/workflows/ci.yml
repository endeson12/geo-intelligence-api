name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env: {POSTGRES_DB: geo, POSTGRES_USER: geo, POSTGRES_PASSWORD: geo}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geo -d geo" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://geo:geo@localhost:5432/geo
      API_KEY: test-secret
      RUN_POSTGIS_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {python-version: "3.12", enable-cache: true}
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run pytest --cov=geo_intelligence_api --cov-report=term-missing
