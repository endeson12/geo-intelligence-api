services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: geo
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    mem_limit: 512m
    cpus: 1.0
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://geo:${POSTGRES_PASSWORD:-geo}@db:5432/geo
      API_KEY: ${API_KEY:?defina API_KEY com pelo menos 32 caracteres}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-120}
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "-c", "alembic upgrade head && uvicorn geo_intelligence_api.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:
