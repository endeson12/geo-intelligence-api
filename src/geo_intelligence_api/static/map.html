<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Mapa | Geo Intelligence API</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}.panel{position:absolute;z-index:999;background:#fff;padding:12px;margin:12px;border-radius:8px;font:14px system-ui;box-shadow:0 2px 10px #0003}</style></head><body><div class="panel"><strong>Infraestruturas sintéticas — Teresina</strong><br>Dados demonstrativos, sem representação oficial.</div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const m=L.map('map').setView([-5.09,-42.80],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);fetch('/api/v1/facilities').then(r=>r.json()).then(d=>L.geoJSON(d,{onEachFeature:(f,l)=>l.bindPopup(`<b>${f.properties.nome}</b><br>${f.properties.tipo}`)}).addTo(m)).catch(()=>L.popup().setLatLng(m.getCenter()).setContent('API temporariamente indisponível').openOn(m));</script></body></html>
